description: >-
  FinOps view of Lodgify spend. Lodgify bills a recurring per-rental SaaS
  subscription (Starter / Professional / Ultimate) on monthly or annual terms,
  plus an optional per-direct-booking fee on the Starter tier and payment
  processing fees on transactions. The Public API itself is included with the
  subscription rather than metered per call, so cost is driven primarily by the
  number of rentals and the chosen tier.
notes: >-
  Subscription rates and the Starter booking fee vary by source and rental
  count; verify against the Lodgify pricing page during reconciliation. API
  calls are not separately metered as of this artifact.
