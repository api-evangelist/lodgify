meters:
- name: subscription_rentals
  description: Recurring subscription billed per rental on the chosen tier.
  unit: rentals
  aggregation: sum
  dimensions:
  - account
  - tier
- name: direct_booking_fee
  description: Per-direct-booking fee applied on the Starter tier.
  unit: bookings
  aggregation: sum
  dimensions:
  - account
  - property
- name: payment_processing_fee
  description: Payment processing fees on transactions handled through Lodgify.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - property
principles:
- name: Visibility
  description: Track the number of active rentals and the subscription tier driving recurring spend.
- name: Allocation
  description: Map per-rental subscription cost to the property or portfolio that owns it.
- name: Optimization
  description: Choose annual billing over monthly to avoid the monthly surcharge; move off the Starter tier to eliminate the per-booking fee when volume justifies it.
- name: Accountability
  description: Review tier and rental count against actual booking volume each renewal cycle.
