aid: lodgify
url: https://raw.githubusercontent.com/api-evangelist/lodgify/refs/heads/main/apis.yml
name: Lodgify
kind: company
description: Lodgify is all-in-one vacation rental software for property owners and
  managers, providing a website builder, booking engine, channel manager, and property
  management system. The Lodgify Public API (v1 and v2) exposes a REST interface at
  https://api.lodgify.com for managing properties, availability, rates and quotes,
  bookings and reservations, guest messaging, and webhook subscriptions, authenticated
  with an X-ApiKey header.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Vacation Rental
- Property Management
- Booking
- Channel Manager
- Travel
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
